[project]
name = "jazzoo"
version = "0.1.0"
description = "A beast of a task-runner"
readme = "README.short.md"
authors = [{ name = "Maarten Nieber" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

# Uncomment at launch, when the GitHub repo is public
# [project.urls]
# Homepage = "https://github.com/mnieber/jazzoo"
# Issues = "https://github.com/mnieber/jazzoo/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jazzoo = "jazzoo.runtime.entrypoints.jazzoo:main"
jaz = "jazzoo.runtime.entrypoints.jazzoo:main"
jaz-run = "jazzoo.commands.entrypoints.jaz_run:main"
zoo = "jazzoo.runtime.entrypoints.zoo:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jazzoo.config._vendor" = ["vendor.txt"]
"jazzoo.config._vendor.yaml" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# setuptools 77 is the first that understands license = "MIT"
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
