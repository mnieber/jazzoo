[project]
name = "jazzoo"
version = "0.1.0"
readme = "README.md"
dependencies = ["dataclassy", "lark"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jazzoo = "jazzoo.runtime.entrypoints.jazzoo:main"
jaz = "jazzoo.runtime.entrypoints.jazzoo:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
