[project]
name = "jazzoo"
version = "0.1.0"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jazzoo = "jazzoo.runtime.entrypoints.jazzoo:main"
jaz = "jazzoo.runtime.entrypoints.jazzoo:main"
jaz-run = "jazzoo.commands.entrypoints.jaz_run:main"
zoo = "jazzoo.runtime.entrypoints.zoo:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jazzoo.config._vendor" = ["vendor.txt"]
"jazzoo.config._vendor.yaml" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
